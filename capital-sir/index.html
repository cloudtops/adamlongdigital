<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <title>Capital SIR Deliverables · Adam Long Digital</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,500;6..96,600&family=Figtree:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="wrap">
  <header class="mast">
    <div>
      <div class="eyebrow">Capital Sotheby's International Realty · Adam Long Digital</div>
      <h1>Marketing Deliverables</h1>
    </div>
    <div class="mast-meta">
      <div class="counts" id="counts"></div>
    </div>
  </header>

  <div class="main">
    <section class="cal" aria-label="Calendar">
      <div class="cal-head">
        <h2 id="monthLabel"></h2>
        <div class="nav">
          <button id="prev" aria-label="Previous month">&lsaquo;</button>
          <button id="todayBtn">Today</button>
          <button id="next" aria-label="Next month">&rsaquo;</button>
        </div>
      </div>
      <div class="dow"><div>Sun</div><div>Mon</div><div>Tue</div><div>Wed</div><div>Thu</div><div>Fri</div><div>Sat</div></div>
      <div class="grid" id="grid"></div>
      <div class="legend">
        <span style="--c:var(--s-todo)">Not started</span>
        <span style="--c:var(--s-prog)">In progress</span>
        <span style="--c:var(--s-rev)">In review</span>
        <span style="--c:var(--s-done)">Delivered</span>
      </div>
    </section>

    <aside class="agenda" aria-label="Up next">
      <div class="agenda-top">
        <h2>Up next</h2>
        <label class="toggle"><input type="checkbox" id="showDone"> Show delivered</label>
      </div>
      <div id="list"><div class="empty">Loading deliverables…</div></div>
      <div class="sync"><span id="syncText"></span><button id="refreshBtn" type="button">Refresh</button></div>
    </aside>
  </div>
</div>
<div id="scrimHost"></div>
<script src="main.js"></script>
</body>
</html>
